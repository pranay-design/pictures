<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pranay.pictures</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0 64px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
        }
        h1 {
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            line-height: 1.4;
        }
        .pulse {
            font-weight: 600;
            background: linear-gradient(270deg, #4285f4, #9b72cb, #d96570, #4285f4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: ai-pulse 4s ease infinite;
        }
        @keyframes ai-pulse {
            0% { background-position: 0% 50%; opacity: 0.85; }
            50% { background-position: 100% 50%; opacity: 1; }
            100% { background-position: 0% 50%; opacity: 0.85; }
        }
    </style>
</head>
<body>
    <h1>Agent is <span class="pulse">vibe-coding</span>. Check back in a bit.</h1>
</body>
</html>
